name: Build, test and publish Pro Aid
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  test-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run database rule tests
        env: { PGPASSWORD: postgres }
        run: |
          sed -i 's#psql -h /tmp -p 5433 -U postgres#psql -h localhost -p 5432 -U postgres#' supabase/run_tests.sh
          cd supabase && bash run_tests.sh | tail -3
  build:
    runs-on: ubuntu-latest
    needs: test-db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - run: npx tsc -p tsconfig.app.json --noEmit && npx vitest run
        working-directory: app
      - name: Build the web app
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build && cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/dist }
  migrate:
    runs-on: ubuntu-latest
    needs: test-db
    if: ${{ secrets.SUPABASE_DB_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations to Supabase
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          for f in supabase/migrations/*.sql; do
            name=$(basename "$f")
            psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -c "create table if not exists public._migrations(name text primary key, applied_at timestamptz default now())" >/dev/null
            if psql "${{ secrets.SUPABASE_DB_URL }}" -Atc "select 1 from public._migrations where name='$name'" | grep -q 1; then echo "skip $name"; continue; fi
            echo "apply $name"; psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -q -f "$f"
            psql "${{ secrets.SUPABASE_DB_URL }}" -c "insert into public._migrations(name) values ('$name')" >/dev/null
          done
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: { name: github-pages, url: ${{ steps.deployment.outputs.page_url }} }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
